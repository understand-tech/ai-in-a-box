name: ${COMPOSE_PROJECT_NAME:-understandtech}

# Overlay for the third machine of a two-box high-availability pair: a light
# arbiter, no GPU, no control-plane state of its own. It exists to tell the two
# paired boxes apart from a network partition between them, so a failure of
# either one can promote the other without producing two primaries. The pair
# can be any topology the product sells, not only two box of calcul — the
# arbiter itself does not know or care what role either side carries.
#
#   COMPOSE_FILE="compose.yaml:compose.arbiter.yaml"
#   COMPOSE_PROFILES=""
#   UT_ADMITTED_BOXES_FILE=<the list ut-pair keeps of the two boxes it serves>
#
# Named after the role rather than the product it arbitrates, so the same file
# applies whatever the two paired boxes' own palier (GB10, GB300, rack) or role.

services:
  caddy:
    # The platform routes in the default Caddyfile reverse_proxy to api and
    # frontend, both off on this role; depending on them would never go
    # healthy, and publishing 80/443 would 502 on every request.
    depends_on: !reset null
    # A list merges with the base service's by default in this version of
    # Compose — !override replaces it, or 80/443 stay published alongside
    # 8446 instead of being swapped out for it.
    ports: !override
      - "${UT_ARBITER_BIND_ADDRESS:-0.0.0.0}:${UT_ARBITER_PORT:-8446}:8446"
    networks:
      ut-backend-network:
    volumes: !override
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/ingress-${UT_INGRESS_MODE:-internal}.caddy:/etc/caddy/ingress.caddy:ro
      - ${UT_CERT_DIR:-./caddy/certs}:/etc/caddy/certs:ro
      - ${UT_ADMITTED_BOXES_FILE:-./caddy/no-inference-surface.caddy}:/etc/caddy/inference.caddy:ro
      - ./caddy/arbiter-surface.caddy:/etc/caddy/link-surface.caddy:ro
      - ./caddy/no-link.caddy:/etc/caddy/link.caddy:ro
      - ./caddy/no-link.caddy:/etc/caddy/arbiter-link.caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  arbiter:
    labels:
      ut.role: "arbiter"
    image: ${ARBITER_IMAGE:?ut-install pins the arbiter image; see github.com/understand-tech/ut-arbiter}
    restart: unless-stopped
    environment:
      UT_ARBITER_ADDR: "0.0.0.0:8446"
    networks:
      ut-backend-network:

  redis:
    profiles: ["control-plane-only"]
  mongodb:
    profiles: ["control-plane-only"]
  mongodb-backup:
    profiles: ["control-plane-only"]
  files-backup:
    profiles: ["control-plane-only"]
  api:
    profiles: ["control-plane-only"]
  workers:
    profiles: ["control-plane-only"]
  frontend:
    profiles: ["control-plane-only"]
  api-customer:
    profiles: ["control-plane-only"]
  workers-customer:
    profiles: ["control-plane-only"]
  app-llms:
    profiles: ["control-plane-only"]
  app-assistants:
    profiles: ["control-plane-only"]
  admin-portal:
    profiles: ["control-plane-only"]
  llm:
    profiles: ["gpu-only"]
  nim-llm:
    profiles: ["gpu-only"]
  metrics:
    profiles: ["control-plane-only"]
