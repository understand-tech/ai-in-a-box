# App Builder — optional add-on to the AI in a Box stack.
#
# Same compose project as compose.yaml (name: understandtech), so it shares
# the platform's networks and reuses ut-mongodb. Enable it per install by
# uncommenting one line in .env:
#
#     COMPOSE_FILE=compose.yaml:compose.appbuilder.yaml
#
# Compose reads COMPOSE_FILE from .env in the project directory, so plain
# `docker compose up -d` and the understandtech.service unit both pick this
# file up with no other change. Comment the line out to ship a box without
# the App Builder.
#
# Three rails connect this to the platform, all inside docker:
#   1. Builder's own LLM calls   app-builder -> api-customer:8501/api/llm
#   2. Generated apps' FM calls  app -> host.docker.internal:8001 (the
#                                builder's proxy) -> the same gateway
#   3. Generated apps' UT v3     app -> ut-api (alias of app-builder-traefik)
#                                -> api-customer:8501
#
# Routing: caddy owns 80/443 and serves builder.understand.local and the
# generated apps' wildcard; app-builder-traefik does per-app routing behind
# it, driven by files the orchestrator writes into
# /var/lib/understandtech/appbuilder/traefik-dynamic.
name: understandtech

# Anchors are per-file in YAML, so these repeat compose.yaml's definitions.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3

services:

  app-builder:
    image: ${APP_BUILDER_IMAGE:-}
    container_name: ut-app-builder
    restart: unless-stopped
    ports:
      # Generated apps run in their own compose projects on their own
      # networks, so they cannot resolve this container by docker DNS. They
      # reach the builder's LLM proxy at host.docker.internal:<this port>,
      # which is why a host port is published at all. Keep it at 8001 unless
      # something else on the host owns it; if you move it, move
      # APP_BUILDER_LLM_PROXY_PORT in .env to match (they must agree, and
      # apps created before the change keep the old value in their .env).
      - "${APP_BUILDER_HOST_PORT:-8001}:8001"
    environment:
      # ---- deployment mode ----
      TYPE_DEPLOIEMENT: ${TYPE_DEPLOIEMENT:-onprem}
      # mongodb => cookie-session mode: the upstream's HS256 session JWT is
      # verified locally with UT_JWT_SECRET. No Firebase anywhere on-prem.
      UPSTREAM_DB_PROVIDER: ${DB_PROVIDER:-mongodb}
      UT_JWT_SECRET: ${JWT_SECRET}
      SESSION_COOKIE_SECURE: ${APP_BUILDER_SESSION_COOKIE_SECURE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # ---- platform wiring (in-cluster HTTP: no caddy hop, no TLS, no CA) ----
      # Cookie-auth ut-api the orchestrator calls for login and API-key mint.
      UNDERSTAND_APP_URL: ${APP_BUILDER_UT_API_URL:-http://api:8501}
      # Main frontend origin — hosts /dashboard-sso, the SSO login target.
      # A BROWSER url, so it must be the public one.
      UNDERSTAND_FRONTEND_URL: ${VITE_UT_APP_URL:-https://understand.local}
      ADMIN_DASHBOARD_URL: ${APP_BUILDER_ADMIN_URL:-https://admin.understand.local}
      # This app's own public origin — used for OAuth callback redirects.
      # Without it the orchestrator falls back to builder.localhost.
      APPBUILDER_BASE_URL: ${APP_BUILDER_BASE_URL:-https://builder.understand.local}
      # UT API v3 base for the orchestrator AND for every generated app's
      # .env, so it must resolve on both networks — hence the `ut-api` alias
      # on app-builder-traefik below rather than api-customer directly.
      # The v3 client appends /api/v3.
      UNDERSTAND_API_URL: ${APP_BUILDER_UT_V3_URL:-http://ut-api}
      API_V3_OPENAPI_URL: ${APP_BUILDER_UT_V3_URL:-http://ut-api}/api/v3/openapi.json

      # ---- LLM rails ----
      # The builder's own helpers (planner, classifier, naming, clarifier)
      # and, with AGENT_BACKEND=deepagents, the build agent itself.
      UT_GATEWAY_BASE_URL: ${APP_BUILDER_GATEWAY_URL:-http://api-customer:8501/api/llm}
      UT_GATEWAY_API_KEY: ${APP_BUILDER_GATEWAY_API_KEY:-}
      UT_GATEWAY_MODEL: ${APP_BUILDER_GATEWAY_MODEL:-uai-large}
      AGENT_BACKEND: ${APP_BUILDER_AGENT_BACKEND:-deepagents}
      AGENT_MAX_OUTPUT_TOKENS: ${APP_BUILDER_AGENT_MAX_OUTPUT_TOKENS:-8192}
      AGENT_MODEL_CONTEXT_TOKENS: ${APP_BUILDER_AGENT_CONTEXT_TOKENS:-24576}
      # Only used when AGENT_BACKEND=sdk (needs outbound internet).
      ANTHROPIC_API_KEY: ${APP_BUILDER_ANTHROPIC_API_KEY:-}
      # What generated apps put in their .env for the FM proxy. Must match
      # the published host port above.
      UT_LLM_BASE_URL: http://host.docker.internal:${APP_BUILDER_LLM_PROXY_PORT:-8001}/api/llm/anthropic

      # ---- database (reuses ut-mongodb; own database, not ut-db) ----
      MONGO_HOST: ${MONGODB_HOST:-mongodb}
      MONGO_PORT: ${MONGODB_PORT:-27017}
      MONGO_USER: ${MONGODB_USERNAME:-}
      MONGO_PASSWORD: ${MONGODB_PASSWORD:-}
      ORCHESTRATOR_DB: ${APP_BUILDER_MONGODB_DB:-app-builder}

      # ---- state on disk ----
      # Bind-mounted at the SAME path inside the container so the docker
      # compose commands the orchestrator runs against the host daemon pass
      # paths the daemon can resolve. PROD_WORKSPACES_DIR defaults to a
      # sibling of WORKSPACES_DIR, which is what we want here.
      REPO_ROOT_HOST: /var/lib/understandtech/appbuilder
      WORKSPACES_DIR: /var/lib/understandtech/appbuilder/workspaces
      TRAEFIK_DYNAMIC_DIR: /var/lib/understandtech/appbuilder/traefik-dynamic

      # ---- routing ----
      # Hostnames for generated apps: <project>.apps.understand.local, plus
      # --staging / --prod surfaces. One label under the suffix, so caddy's
      # single *.apps.understand.local wildcard covers every app forever.
      PREVIEW_DOMAIN_SUFFIX: ${APP_BUILDER_PREVIEW_SUFFIX:-apps.understand.local}
      TRAEFIK_URL: http://app-builder-traefik:80
      # Where traefik's middlewares call back into the orchestrator. The
      # compose service is not named `orchestrator`, so the default is wrong.
      ORCHESTRATOR_INTERNAL_URL: http://app-builder:8001
      ORCHESTRATOR_TRAEFIK_SERVICE: builder-api
    volumes:
      # The orchestrator drives the host docker daemon to build and run the
      # generated apps' own compose projects.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/understandtech/appbuilder:/var/lib/understandtech/appbuilder
      # Claude CLI conversation state — survives container replacement so
      # in-flight projects can still resume their sessions.
      - app-builder-claude-state:/root/.claude
    networks:
      - ut-frontend-network
    depends_on:
      mongodb:
        condition: service_healthy
      api-customer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      <<: *healthcheck-defaults
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${APP_BUILDER_MEMORY_LIMIT:-4G}
          cpus: ${APP_BUILDER_CPU_LIMIT:-2}
        reservations:
          memory: 1G

  # Per-app router. Not a second public entrypoint: caddy keeps 80/443 and
  # proxies the *.apps wildcard here, so no host port is published. The
  # orchestrator writes one YAML per project into the watched dynamic dir
  # (file provider, hot-reloaded) — traefik 3.x speaks docker API v1.24,
  # which docker 29+ refuses, so the docker provider is not an option.
  app-builder-traefik:
    image: traefik:v3.2
    container_name: ut-app-builder-traefik
    restart: unless-stopped
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    volumes:
      # Per-project files, written at runtime by the orchestrator.
      - /var/lib/understandtech/appbuilder/traefik-dynamic:/etc/traefik/dynamic:ro
      # Static config, shipped with this repo, mounted INTO the dir above:
      # the builder-api service every per-project sleep-page middleware
      # refers to, plus the `ut-api` route generated apps use for UT v3.
      - ./appbuilder/traefik/_orchestrator.yml:/etc/traefik/dynamic/_orchestrator.yml:ro
    networks:
      ut-frontend-network:
        # Generated apps get UNDERSTAND_API_URL=http://ut-api; the
        # orchestrator resolves the same name on this network.
        aliases:
          - ut-api
      appbuilder-proxy:
        aliases:
          - ut-api
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      <<: *healthcheck-defaults
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

networks:
  # Generated apps join this by the literal name `proxy` (external, declared
  # in each app's own compose file) with a service alias of the project id,
  # which is how traefik reaches them. The name is baked into the templates.
  appbuilder-proxy:
    name: proxy
    driver: bridge

volumes:
  app-builder-claude-state:
    name: ut-app-builder-claude-state
