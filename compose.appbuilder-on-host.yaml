name: ${COMPOSE_PROJECT_NAME:-understandtech}

# The App Builder on this machine's own Docker, as before its apps had a Docker
# of their own: APP_BUILDER_DOCKER="host" in local.env, then ut-install. Kept
# while the move proves itself on the fleet. Whoever holds the socket mounted
# below is root on this machine.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3

services:

  app-builder:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  app-builder-traefik:
    labels:
      ut.release: "${UT_RELEASE_VERSION:-}"
    image: ${TRAEFIK_IMAGE:-traefik:v3.2@sha256:e561a37f8710d9cf41c78bdf421d822b2c0b48267ec0552e644565fb55466ea9}
    container_name: ${CONTAINER_PREFIX:-ut}-app-builder-traefik
    restart: unless-stopped
    command:
      # Traefik checks for a new version by default: measured on .31 on 2026-10-21,
      # its calls out were the ones a box with no network refused.
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
    volumes:
      - ${DATA_ROOT:-/var/lib/understandtech}/appbuilder/traefik-dynamic:/etc/traefik/dynamic
      - ./appbuilder/traefik/_orchestrator.yml:/etc/traefik/dynamic/_orchestrator.yml:ro
    networks:
      ut-frontend-network:
        aliases:
          - ut-api-v3
      proxy:
        aliases:
          - ut-api-v3
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      <<: *healthcheck-defaults
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  # Coming back here, ut-install starts the apps' own Docker once more to take
  # them out of it, and copies their volumes with its tools: declared here, its
  # image comes onto this machine with the others.
  app-builder-docker-image:
    labels:
      ut.role: "control-plane"
    image: ${APP_BUILDER_DOCKER_IMAGE:-docker:29.6.2-dind-rootless@sha256:212a9e782c7119fd6a212beaab6b7665a29b663d894d0f6201710c89575ad0ae}
    container_name: ${CONTAINER_PREFIX:-ut}-app-builder-docker-image
    restart: "no"
    entrypoint: ["true"]
    network_mode: none
    logging: *default-logging

networks:
  proxy:
    name: proxy
    external: true

