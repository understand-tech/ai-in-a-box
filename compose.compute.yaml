name: ${COMPOSE_PROJECT_NAME:-understandtech}

# Overlay for a machine that only serves inference — a second DGX added to an
# existing deployment. It keeps the NIM engines and Caddy, and switches off
# everything that belongs to the control plane.
#
#   COMPOSE_FILE="compose.yaml:compose.compute.yaml"
#   COMPOSE_PROFILES="nim"
#   UT_INFERENCE_ADDRESS=<name or address the control plane reaches it by>
#
# The control plane reaches the engine at https://<UT_INFERENCE_ADDRESS>:8444/v1
# with this machine's VLLM_API_KEY, and trusts Caddy's root for it. The engine's
# own port stays on loopback.
#
# Services are switched off by giving them a profile that is never enabled,
# rather than by listing the survivors in a separate file. compose.yaml stays
# the single definition of every service: this file only says which ones a
# compute node leaves out.
#
# 'llm' is switched off here too, and that is a limitation rather than a choice.
# It carries the embedding and reranking work, but it also reads the customer's
# documents and talks to MongoDB, so it cannot run on a machine that holds
# neither. A compute node therefore serves generation and vision, which is where
# the GPU time goes, while indexing stays on the machine that has the data.

services:
  caddy:
    depends_on: !reset null
    # A compute node enrols with the control plane's authority; it runs none of
    # its own, so the machine-facing surface has nothing to ask a certificate
    # of and would retry ACME forever.
    ports:
      - "${UT_INFERENCE_BIND_ADDRESS:-0.0.0.0}:${UT_INFERENCE_PORT:-8444}:8444"
    environment:
      UT_INFERENCE_ADDRESS: ${UT_INFERENCE_ADDRESS:-${UT_DOMAIN:-understand.local}}
      VLLM_API_KEY: ${VLLM_API_KEY:?ut-install generates it}
    networks:
      ut-backend-network:
    volumes: !override
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/ingress-${UT_INGRESS_MODE:-internal}.caddy:/etc/caddy/ingress.caddy:ro
      - ${UT_CERT_DIR:-./caddy/certs}:/etc/caddy/certs:ro
      - ./caddy/no-internal-surface.caddy:/etc/caddy/surface.caddy:ro
      - ./caddy/inference-surface.caddy:/etc/caddy/inference.caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  step-ca:
    profiles: ["control-plane-only"]

  redis:
    profiles: ["control-plane-only"]
  mongodb:
    profiles: ["control-plane-only"]
  mongodb-backup:
    profiles: ["control-plane-only"]
  api:
    profiles: ["control-plane-only"]
  workers:
    profiles: ["control-plane-only"]
  frontend:
    profiles: ["control-plane-only"]
  api-customer:
    profiles: ["control-plane-only"]
  workers-customer:
    profiles: ["control-plane-only"]
  app-llms:
    profiles: ["control-plane-only"]
  app-assistants:
    profiles: ["control-plane-only"]
  admin-portal:
    profiles: ["control-plane-only"]
  llm:
    profiles: ["control-plane-only"]
