# The engine exposes about 480 series; only those saying how loaded it is and how
# long a user waits are kept.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: inference
    static_configs:
      - targets: ["nim-llm:8000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "vllm:(num_requests_running|num_requests_waiting|kv_cache_usage_perc|num_preemptions_total|prompt_tokens_total|prefix_cache_queries_total|prefix_cache_hits_total|generation_tokens_total|request_success_total|(time_to_first_token|inter_token_latency|request_queue_time|request_prefill_time|request_decode_time|e2e_request_latency)_seconds_(bucket|sum|count)|request_(prompt|generation)_tokens_(bucket|sum|count))"
        action: keep

  # What each request costs and how fast it is answered, by tool and prompt size:
  # the gateway's and the LLM service's ut_inference_* families, plus the
  # gateway's own ut_cost_* (dollars for a SaaS call, GPU-seconds for a local
  # one, summed by tool only — never by route or model, see ut-api's
  # pricing.py). Both answer /metrics only to the bearer of GATEWAY_METRICS_TOKEN.
  - job_name: gateway
    authorization:
      credentials_file: /run/secrets/gateway_metrics_token
    static_configs:
      - targets: ["api:8501", "api-customer:8501"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "ut_(inference|cost)_.*"
        action: keep

  - job_name: llm
    authorization:
      credentials_file: /run/secrets/gateway_metrics_token
    static_configs:
      - targets: ["llm:8000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "ut_inference_.*"
        action: keep

  # What each surface of the front door answered and how long it took, by host
  # and status code, with the health of each upstream. Caddy counts a request
  # under the outermost handler of its route — subroute for every site here —
  # never under the reverse_proxy inside it. Its own scrapes, under "metrics",
  # are dropped.
  - job_name: caddy
    scrape_interval: 60s
    static_configs:
      - targets: ["caddy:2020"]
    metric_relabel_configs:
      - source_labels: [__name__, handler]
        regex: "caddy_http_(requests_total|request_errors_total|request_duration_seconds_(bucket|sum|count));metrics"
        action: drop
      - source_labels: [__name__]
        regex: "caddy_http_(requests_total|request_errors_total|request_duration_seconds_(bucket|sum|count))|caddy_reverse_proxy_upstreams_healthy"
        action: keep
