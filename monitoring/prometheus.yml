global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # vLLM engine metrics from the NIMs — 5s so saturation onset is sharp.
  - job_name: vllm
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["nim-llm:8000"]
        labels: { service: nim-llm }
      - targets: ["nim-vlm:8000"]
        labels: { service: nim-vlm }

  - job_name: dcgm
    scrape_interval: 5s
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
