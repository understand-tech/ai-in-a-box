name: ${COMPOSE_PROJECT_NAME:-understandtech}

# Overlay for a backup sent to S3, SFTP or a REST server:
#
#   BACKUP_FILES_REPOSITORY="sftp:backup@nas.example:/appliance"
#
# ut-install adds it to COMPOSE_FILE and writes the BACKUP_RELAY_* settings.
# files-backup, which reads every document, gets no way out: it resolves the
# destination's name to the relay, the one service that reaches the network and
# only that host and port. TLS and the SSH host key are still checked end to end.
#
# Left unset, the relay sends to a name that resolves nowhere, rather than carry
# a ${...:?} guard: the test suites read every such guard as a setting all
# installs require, and these only exist here.

services:
  files-backup:
    networks:
      - ut-backup-relay-network
    extra_hosts:
      - "${BACKUP_RELAY_HOST:-backup-destination.invalid}:${BACKUP_RELAY_ADDRESS:-198.18.255.250}"
    volumes:
      - ${BACKUP_FILES_SSH_DIR:-/etc/understandtech/backup-ssh}:/root/.ssh:ro
    depends_on:
      - backup-relay

  backup-relay:
    labels:
      ut.role: "backup"
    image: ${BACKUP_RELAY_IMAGE:-alpine/socat:1.8.1.3@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287}
    container_name: ${CONTAINER_PREFIX:-ut}-backup-relay
    restart: unless-stopped
    command:
      - TCP-LISTEN:${BACKUP_RELAY_PORT:-443},fork,reuseaddr,bind=${BACKUP_RELAY_ADDRESS:-198.18.255.250}
      - TCP:${BACKUP_RELAY_HOST:-backup-destination.invalid}:${BACKUP_RELAY_PORT:-443}
    # Asks the network's DNS for the destination and nothing more: a connection
    # every half minute would fill an SSH server's log, and some ban for that.
    healthcheck:
      test: ["CMD", "nslookup", "${BACKUP_RELAY_HOST:-backup-destination.invalid}"]
      interval: 5m
      timeout: 10s
      retries: 3
    networks:
      ut-backup-relay-network:
        ipv4_address: ${BACKUP_RELAY_ADDRESS:-198.18.255.250}
      ut-backup-network: {}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

networks:
  ut-backup-relay-network:
    name: ${RESOURCE_PREFIX:-ut}-backup-relay-network
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${BACKUP_RELAY_SUBNET:-198.18.255.248/29}
  ut-backup-network:
    name: ${RESOURCE_PREFIX:-ut}-backup-network
    driver: bridge
