name: ${COMPOSE_PROJECT_NAME:-understandtech}

# Overlay for a platform whose inference comes from a compute node.
#
#   UT_LINKED_NODE_FILE=<the file ut-pair writes once the platform is paired>
#
# ut-install adds it with --inference-from, and points VLLM_LLM_BASE_URL at
# http://caddy:8445/v1. The services keep calling a plain address with
# VLLM_API_KEY; this box's Caddy carries the request to the node under its link
# certificate, and trusts the node's root alone for the answer.

services:
  caddy:
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?ut-install generates it}
    volumes:
      - ${UT_LINKED_NODE_FILE:-./caddy/no-link.caddy}:/etc/caddy/link.caddy:ro
      - ./caddy/link-relay.caddy:/etc/caddy/link-relay.caddy:ro
