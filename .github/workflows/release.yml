name: release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dpkg-deb writes the build time into the archive, so two builds a second
      # apart differ. Fixing it to the commit's own date is what lets anyone
      # rebuild this tag and get the bytes that were signed.
      - name: Read the version from the tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # A release that fails its own checks is worse than no release: it is
      # installed before anyone notices.
      - name: Repository invariants
        run: ./test/invariants.sh

      - name: Capabilities
        run: ./test/capabilities.sh

      # A release that cannot install on a bare machine must not be published.
      - name: A fresh install, walked
        run: ./test/fresh-install.sh

      - name: Build the package
        run: ./packaging/build-deb.sh "$VERSION"

      - name: Sign it
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_SIGNING_KEY" ] || {
            echo "::error::RELEASE_SIGNING_KEY is not set — nothing would verify this release"
            exit 1
          }
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          deb="dist/understandtech_${VERSION}_all.deb"
          openssl dgst -sha256 -sign "$key" -out "${deb}.sig" "$deb"

      # Proves the secret matches the public key shipped in ut-verify. Without
      # this step a mismatched key produces a signature nobody can check, and
      # the failure only shows up on a customer's offline machine.
      - name: Verify what was just signed
        run: ./ut-verify "dist/understandtech_${VERSION}_all.deb"

      # release.pub is published beside the package it verifies, so whoever can
      # replace one can replace both. An attestation is an anchor that does not
      # rest on our own key: it ties this file to this workflow and this commit,
      # and `gh attestation verify` checks it against GitHub instead.
      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/understandtech_${{ env.VERSION }}_all.deb

      # The package holds shell and configuration, so its own bill of materials
      # names one component: itself. What the appliance is made of is the
      # thirteen images, and release.env names them by digest since #67.
      - name: What this release is made of
        run: ./packaging/release-bom.sh "$VERSION" > "dist/understandtech_${VERSION}.cdx.json"

      - name: Attest the bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/understandtech_${{ env.VERSION }}_all.deb
          sbom-path: dist/understandtech_${{ env.VERSION }}.cdx.json

      - name: Checksums
        run: |
          set -euo pipefail
          cp ut-verify packaging/release.pub dist/
          ( cd dist && sha256sum understandtech_*.deb understandtech_*.deb.sig understandtech_*.cdx.json ut-verify release.pub > SHA256SUMS )

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed "s/VERSION/${VERSION}/g" packaging/release-notes.md > dist/notes.md

          # A version carrying a suffix — 2026.09.0-rc1 — is a candidate, and
          # marking it keeps it off the repository page as the one to install.
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac

          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --notes-file dist/notes.md \
            "${prerelease[@]}" \
            dist/understandtech_"$VERSION"_all.deb \
            dist/understandtech_"$VERSION"_all.deb.sig \
            dist/understandtech_"$VERSION".cdx.json \
            dist/ut-verify \
            dist/release.pub \
            dist/SHA256SUMS
