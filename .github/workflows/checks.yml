name: checks

on:
  push:
    branches: [main, "hotfix/**", "2026-**"]
  pull_request:

permissions:
  contents: read

# Every suite runs twice: once on x86-64 and once on arm64, which is the only
# architecture the product ships. Until now nothing exercised it.
#
# Branch protection requires three of these checks by their exact name, so the
# x86 leg keeps the bare name it had before the matrix existed. Renaming it
# would leave a pull request waiting forever on a check that no longer reports.
jobs:
  # The suites read README.md and docs/first-run-configuration.md, so only the
  # rest of docs/ and mkdocs.yml are a change they cannot break. Their jobs still
  # run with every step skipped: branch protection waits on their exact names.
  changes:
    name: what the change touches
    runs-on: ubuntu-24.04
    outputs:
      beyond-docs: ${{ steps.diff.outputs.beyond-docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null \
              && git diff --quiet "$BASE" HEAD -- . ':!docs' ':!mkdocs.yml' \
              && git diff --quiet "$BASE" HEAD -- docs/first-run-configuration.md; then
            echo "beyond-docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "beyond-docs=true" >> "$GITHUB_OUTPUT"
          fi

  invariants:
    name: repository invariants${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: " on arm64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./test/invariants.sh

  # A model of the database password rotation, proved, and checked against the
  # installer cut at every step: formal/README.md.
  database-rotation:
    name: database password rotation survives every cut
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the proof
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: formal
          build-args: --wfail RotationProofs rotation_cases rotation_report
          axiom-audit: true
          axiom-audit-root: Rotation
      # The report builds without the proof, so it still names the broken cut.
      - name: Report every cut
        if: ${{ !cancelled() }}
        working-directory: formal
        shell: bash
        run: lake exe rotation_report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replay every cut on ut-install
        if: ${{ !cancelled() }}
        shell: bash
        run: (cd formal && lake exe rotation_cases) | ./test/database-rotation-cuts.sh

  # The split of main's .env into local.env, cut at every step: formal/README.md.
  settings-migration:
    name: settings migrated from main survive every cut
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the proof
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: formal
          build-args: --wfail SettingsProofs settings_cases settings_report
          axiom-audit: true
          axiom-audit-root: Settings
      - name: Report every cut
        if: ${{ !cancelled() }}
        working-directory: formal
        shell: bash
        run: lake exe settings_report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Replay every cut on ut-install
        if: ${{ !cancelled() }}
        shell: bash
        run: (cd formal && lake exe settings_cases) | ./test/settings-migration-cuts.sh

  # ut-send is the one compiled tool: vetted, tested, formatted, and built for
  # both architectures the package carries, so a release cannot fail to compile.
  ut-send:
    name: ut-send builds and passes its tests
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - if: needs.changes.outputs.beyond-docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.beyond-docs == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: needs.changes.outputs.beyond-docs == 'true'
        run: go vet ./...
      - if: needs.changes.outputs.beyond-docs == 'true'
        run: go test ./...
      - if: needs.changes.outputs.beyond-docs == 'true'
        run: test -z "$(gofmt -l .)"
      - if: needs.changes.outputs.beyond-docs == 'true'
        run: ./packaging/build-ut-send.sh

  capabilities:
    name: capabilities${{ matrix.suffix }}
    needs: changes
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: " on arm64"
    steps:
      - if: needs.changes.outputs.beyond-docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.beyond-docs == 'true'
        run: ./test/capabilities.sh

  # The only suite that reaches a service actually running. It can, because the
  # front door is caddy:2-alpine — public — and stubs answer for the eight
  # upstreams. The application images stay out of reach of any runner.
  ingress:
    name: the front door actually serves${{ matrix.suffix }}
    needs: changes
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: " on arm64"
    steps:
      - if: needs.changes.outputs.beyond-docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.changes.outputs.beyond-docs == 'true'
        run: ./test/ingress.sh

  migration:
    name: an existing install survives the upgrade${{ matrix.suffix }}
    needs: changes
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            suffix: ""
          - runner: ubuntu-24.04-arm
            suffix: " on arm64"
    steps:
      - if: needs.changes.outputs.beyond-docs == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: needs.changes.outputs.beyond-docs == 'true'
        run: ./test/migration.sh
      - name: from the last version of the package
        if: needs.changes.outputs.beyond-docs == 'true'
        run: MIGRATION_FROM="$(git describe --tags --abbrev=0 --match 'v*')" ./test/migration.sh
