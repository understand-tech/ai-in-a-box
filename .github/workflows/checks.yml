name: checks

on:
  push:
    branches: [main, "hotfix/**", "2026-**"]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./test/invariants.sh

  capabilities:
    name: capabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./test/capabilities.sh

  migration:
    name: an existing install survives the upgrade
    runs-on: ubuntu-latest
    steps:
      # The starting point is a commit, not the working tree, so the history
      # has to be there — a shallow checkout cannot reach the branch a customer
      # installed from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./test/migration.sh
