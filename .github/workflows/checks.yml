name: checks

on:
  push:
    branches: [main, "hotfix/**", "2026-**"]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: repository invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./test/invariants.sh

  capabilities:
    name: capabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./test/capabilities.sh

  migration:
    name: an existing install survives the upgrade
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./test/migration.sh
