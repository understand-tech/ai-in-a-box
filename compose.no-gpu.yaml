name: ${COMPOSE_PROJECT_NAME:-understandtech}

# Overlay for a machine that has no GPU: a developer laptop, a CI runner, or a
# test box. It switches off the services that request an NVIDIA device and would
# otherwise fail to start.
#
#   COMPOSE_FILE="compose.yaml:compose.no-gpu.yaml"
#   COMPOSE_PROFILES=""
#
# Inference has to come from somewhere else. Point the platform at a machine
# that does have a GPU:
#
#   VLLM_LLM_BASE_URL="https://dgx.example/v1"
#   VLLM_VLM_BASE_URL="https://dgx.example/v1"
#   GPU_VM_URL="https://dgx.example"
#
# The file is named after what is true of the machine rather than what it is
# used for, because the same constraint applies to a laptop, a runner and a test
# host — and naming it "dev" would invite someone to add development-only
# settings to it later.
#
# nim-llm needs no entry here: it already sits behind the "nim" profile, so
# leaving COMPOSE_PROFILES empty keeps it out.

services:
  llm:
    profiles: ["gpu-only"]
