name: understandtech

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3

# Public URLs.
#
# Every one of them derives from UT_DOMAIN and UT_PUBLIC_SCHEME (.env), and
# every one stays individually overridable: a value written explicitly in .env
# wins over the derived default, so a .env from before this change produces
# exactly the values it did before.
#
# UT_PUBLIC_SCHEME is the scheme the applications advertise to the browser. It
# does not follow UT_CADDY_SCHEME, which is the one Caddy listens on: behind a
# load balancer that terminates TLS, Caddy speaks http while these public URLs
# must stay on https.
x-public-urls:
  public-base:         &url-public-base         ${PUBLIC_BASE_URL:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}}
  domain:              &url-domain              ${DOMAIN_URL:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}/}
  backend:             &url-backend             ${BACKEND_URL:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}/api}
  redirect-path:       &url-redirect-path       ${REDIRECT_PATH:-/api/auth/callback}
  redirect-uri:        &url-redirect-uri        ${REDIRECT_URI:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}${REDIRECT_PATH:-/api/auth/callback}}
  frontend-auth:       &url-frontend-auth       ${FRONTEND_URL_AUTH:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}/en/chat}
  allowed-origins:     &url-allowed-origins     ${EXTRA_ALLOWED_ORIGINS:-${UT_PUBLIC_SCHEME:-https}://admin.${UT_DOMAIN:-understand.local},${UT_PUBLIC_SCHEME:-https}://llms.${UT_DOMAIN:-understand.local},${UT_PUBLIC_SCHEME:-https}://assistants.${UT_DOMAIN:-understand.local},${UT_PUBLIC_SCHEME:-https}://builder.${UT_DOMAIN:-understand.local}}
  gateway-public:      &url-gateway-public      ${GATEWAY_PUBLIC_URL:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}}
  vite-api-rest:       &url-vite-api-rest       ${VITE_URL_API_REST:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}}
  vite-api-base:       &url-vite-api-base       ${VITE_API_BASE_URL:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}/api}
  vite-ut-app:         &url-vite-ut-app         ${VITE_UT_APP_URL:-${UT_PUBLIC_SCHEME:-https}://${UT_DOMAIN:-understand.local}}
  app-llms:            &url-app-llms            ${APP_LLMS_BASE_URL:-${UT_PUBLIC_SCHEME:-https}://llms.${UT_DOMAIN:-understand.local}}
  app-llms-cors:       &url-app-llms-cors       ${APP_LLMS_CORS_ORIGINS:-${UT_PUBLIC_SCHEME:-https}://llms.${UT_DOMAIN:-understand.local}}
  app-assistants:      &url-app-assistants      ${APP_ASSISTANTS_BASE_URL:-${UT_PUBLIC_SCHEME:-https}://assistants.${UT_DOMAIN:-understand.local}}
  app-assistants-cors: &url-app-assistants-cors ${APP_ASSISTANTS_CORS_ORIGINS:-${UT_PUBLIC_SCHEME:-https}://assistants.${UT_DOMAIN:-understand.local}}
  app-builder:         &url-app-builder         ${APP_BUILDER_BASE_URL:-${UT_PUBLIC_SCHEME:-https}://builder.${UT_DOMAIN:-understand.local}}

services:

  caddy: 
    image: caddy:2-alpine
    container_name: ut-caddy
    restart: unless-stopped
    ports:
      - "${UT_HTTP_PORT:-80}:80"
      - "${UT_HTTPS_PORT:-443}:443"
    environment:
      # Substituted by Caddy in the Caddyfile and in the mode fragment. Always
      # a real default, never ${VAR:-}: a placeholder that is set but empty
      # fails to adapt the Caddyfile, whereas an absent one falls back to the
      # default written in the file itself.
      UT_DOMAIN: ${UT_DOMAIN:-understand.local}
      UT_CADDY_SCHEME: ${UT_CADDY_SCHEME:-https}
      UT_TRUSTED_PROXIES: ${UT_TRUSTED_PROXIES:-private_ranges}
      UT_CERT_FILE: ${UT_CERT_FILE:-/etc/caddy/certs/fullchain.pem}
      UT_KEY_FILE: ${UT_KEY_FILE:-/etc/caddy/certs/privkey.pem}
      UT_APPS_CERT_FILE: ${UT_APPS_CERT_FILE:-/etc/caddy/certs/fullchain.pem}
      UT_APPS_KEY_FILE: ${UT_APPS_KEY_FILE:-/etc/caddy/certs/privkey.pem}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Ingress mode fragment: global options plus the (tls)/(tls_apps)
      # snippets. A typo in UT_INGRESS_MODE does not show up in
      # `docker compose config` — docker would create a directory in place of
      # the missing file. `setup-autostart.sh --check` catches it before `up`.
      - ./caddy/ingress-${UT_INGRESS_MODE:-internal}.caddy:/etc/caddy/ingress.caddy:ro
      # Operator-supplied certificates (UT_INGRESS_MODE="custom"). Mounted
      # unconditionally: the directory is empty in the other modes, where the
      # Caddyfile never refers to it.
      - ${UT_CERT_DIR:-./caddy/certs}:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ut-frontend-network
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      <<: *healthcheck-defaults
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M

  redis:
    image: redis:7.2-alpine
    container_name: ut-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - ut-backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *healthcheck-defaults
      interval: 10s
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 256M

  mongodb:
    image: mongo:8.2
    container_name: ut-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-}
    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --setParameter diagnosticDataCollectionEnabled=false
    volumes:
      - mongodb-data:/data/db
    networks:
      - ut-frontend-network
      - ut-backend-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "-u", "${MONGODB_USERNAME:-}", "-p", "${MONGODB_PASSWORD:-}", "--authenticationDatabase", "admin"]
      <<: *healthcheck-defaults
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G

  mongodb-backup:
    image: tiredofit/db-backup:4.1.100
    container_name: ut-mongodb-backup
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-UTC}
      CONTAINER_ENABLE_MONITORING: FALSE
      DEFAULT_LOG_LEVEL: INFO

      DB01_TYPE: mongo
      DB01_HOST: mongodb
      DB01_PORT: ${MONGODB_PORT:-27017}
      # Restore one database out of the archive with:
      #   mongorestore --archive=<file> --gzip --nsInclude='ut-app-llms.*'
      DB01_USER: ${MONGODB_USERNAME:-mongoadmin}
      DB01_PASS: ${MONGODB_PASSWORD:-12345678}
      DB01_AUTH: admin

      DB01_BACKUP_BEGIN: ${BACKUP_BEGIN:-1520}
      DB01_BACKUP_INTERVAL: ${BACKUP_INTERVAL:-1440}

      # Retention: delete backups older than 30 days
      DB01_CLEANUP_TIME: ${BACKUP_CLEANUP_TIME:-43200}

      # Compression
      DB01_COMPRESSION: ${BACKUP_COMPRESSION:-GZ}
      DB01_COMPRESSION_LEVEL: ${BACKUP_COMPRESSION_LEVEL:-6}
    volumes:
      - mongodb-backups:/backup
    networks:
      - ut-backend-network
    depends_on:
      mongodb:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  api:
    image: ${API_IMAGE:-}
    container_name: ut-api
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TYPE_DEPLOIEMENT: ${TYPE_DEPLOIEMENT:-}
      LOCAL_STORAGE_BASE: ${LOCAL_STORAGE_BASE:-}
      DB_PROVIDER: ${DB_PROVIDER:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      openid_scope: ${openid_scope:-}
      DOMAIN_URL: *url-domain
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_PORT: ${MONGODB_PORT:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_HOST: ${REDIS_HOST:-}
      PUBLIC_BASE_URL: *url-public-base
      REDIRECT_PATH: *url-redirect-path
      REDIRECT_URI: *url-redirect-uri
      STATE_SECRET: ${STATE_SECRET:-}
      GPU_VM_API_TOKEN: ${GPU_VM_API_TOKEN:-}
      GPU_VM_URL: ${GPU_VM_URL:-}
      ADMIN_MAIL: ${ADMIN_MAIL:-}
      BACKEND_URL: *url-backend
      FRONTEND_URL_AUTH: *url-frontend-auth
      ADMIN_SETUP_PASSWORD: ${ADMIN_SETUP_PASSWORD:-}
      OA_KEY: ${OA_KEY:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-}
      EXTRA_ALLOWED_ORIGINS: *url-allowed-origins
      JWT_SECRET: ${JWT_SECRET}
      VLLM_LLM_BASE_URL: ${VLLM_LLM_BASE_URL:-}
      VLLM_VLM_BASE_URL: ${VLLM_VLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      GATEWAY_DEFAULT_MODEL: ${GATEWAY_DEFAULT_MODEL:-}
      GATEWAY_LLM_SERVED_NAME: ${GATEWAY_LLM_SERVED_NAME:-}
      GATEWAY_VLM_MODEL: ${GATEWAY_VLM_MODEL:-}
      GATEWAY_PUBLIC_URL: *url-gateway-public
      GATEWAY_RPM_PER_KEY: ${GATEWAY_RPM_PER_KEY:-}
      API_KEY_HASH_NEW_KEYS: ${API_KEY_HASH_NEW_KEYS:-}
      API_KEY_HASH_LAZY_MIGRATION: ${API_KEY_HASH_LAZY_MIGRATION:-}
      GATEWAY_MODELS: ${GATEWAY_MODELS:-}
      APP_BUILDER_BASE_URL: *url-app-builder
    volumes:
      - uploads-data:/tmp/uploads
      - /var/lib/understandtech/app-data:/app/storage
    networks:
      - ut-backend-network
      - ut-frontend-network
    depends_on:
      mongodb:
        condition: service_healthy
      #llm:
        #condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/api/docs"]
      <<: *healthcheck-defaults
      start_period: 60s
    logging: *default-logging
    #stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G

  workers:
    image: ${WORKER_IMAGE:-}
    restart: unless-stopped
    command: ["sh", "-c", "rq worker --url redis://redis:6379 ut-api"]
    environment:
      TYPE_DEPLOIEMENT: ${TYPE_DEPLOIEMENT:-}
      BACKEND_URL: *url-backend
      LOCAL_STORAGE_BASE: ${LOCAL_STORAGE_BASE:-}
      DB_PROVIDER: ${DB_PROVIDER:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_PORT: ${MONGODB_PORT:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-}
      GPU_VM_URL: ${GPU_VM_URL:-}
      GPU_VM_API_TOKEN: ${GPU_VM_API_TOKEN:-}
      DOMAIN_URL: *url-domain
      FRONTEND_URL_AUTH: *url-frontend-auth
      ADMIN_MAIL: ${ADMIN_MAIL:-}
    volumes:
      - uploads-data:/tmp/uploads
      - /var/lib/understandtech/app-data:/app/storage
    networks:
      - ut-backend-network
      - ut-frontend-network
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *default-logging
    #stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-}
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M

  frontend:
    image: ${FRONTEND_IMAGE:-}
    container_name: ut-frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      BACKEND_URL: *url-backend
      VITE_URL_API_REST: *url-vite-api-rest
      VITE_AUTH_TYPE: ${VITE_AUTH_TYPE:-}
      VITE_DEPLOYMENT_TYPE: ${VITE_DEPLOYMENT_TYPE:-}
      VITE_DB_PROVIDER: ${DB_PROVIDER:-}
    networks:
      - ut-frontend-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      <<: *healthcheck-defaults
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  api-customer:
    image: ${API_CUSTOMER_IMAGE:-}
    container_name: ut-api-customer
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      TYPE_DEPLOIEMENT: ${TYPE_DEPLOIEMENT:-}
      LOCAL_STORAGE_BASE: ${LOCAL_STORAGE_BASE:-}
      DB_PROVIDER: ${DB_PROVIDER:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      openid_scope: ${openid_scope:-}
      DOMAIN_URL: *url-domain
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_PORT: ${MONGODB_PORT:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_HOST: ${REDIS_HOST:-}
      PUBLIC_BASE_URL: *url-public-base
      REDIRECT_PATH: *url-redirect-path
      REDIRECT_URI: *url-redirect-uri
      STATE_SECRET: ${STATE_SECRET:-}
      GPU_VM_API_TOKEN: ${GPU_VM_API_TOKEN:-}
      GPU_VM_URL: ${GPU_VM_URL:-}
      ADMIN_MAIL: ${ADMIN_MAIL:-}
      BACKEND_URL: *url-backend
      FRONTEND_URL_AUTH: *url-frontend-auth
      OA_KEY: ${OA_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      DEPLOY_ENV: ${DEPLOY_ENV:-}
      VLLM_LLM_BASE_URL: ${VLLM_LLM_BASE_URL:-}
      VLLM_VLM_BASE_URL: ${VLLM_VLM_BASE_URL:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      GATEWAY_DEFAULT_MODEL: ${GATEWAY_DEFAULT_MODEL:-}
      GATEWAY_LLM_SERVED_NAME: ${GATEWAY_LLM_SERVED_NAME:-}
      GATEWAY_VLM_MODEL: ${GATEWAY_VLM_MODEL:-}
      GATEWAY_PUBLIC_URL: *url-gateway-public
      GATEWAY_RPM_PER_KEY: ${GATEWAY_RPM_PER_KEY:-}
      API_KEY_HASH_NEW_KEYS: ${API_KEY_HASH_NEW_KEYS:-}
      API_KEY_HASH_LAZY_MIGRATION: ${API_KEY_HASH_LAZY_MIGRATION:-}
      GATEWAY_MODELS: ${GATEWAY_MODELS:-}
    volumes:
      - uploads-data:/tmp/uploads
      - /var/lib/understandtech/app-data:/app/storage
    networks:
      - ut-backend-network
      - ut-frontend-network
    depends_on:
      mongodb:
        condition: service_healthy
      #llm:
        #condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/api/v3/docs"]
      <<: *healthcheck-defaults
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G

  workers-customer:
    image: ${WORKER_CUSTOMER_IMAGE:-}
    restart: unless-stopped
    command: ["sh", "-c", "rq worker --url redis://redis:6379 ut-api-partners"]
    environment:
      DB_PROVIDER: ${DB_PROVIDER:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_PORT: ${MONGODB_PORT:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-}
      GPU_VM_URL: ${GPU_VM_URL:-}
      GPU_VM_API_TOKEN: ${GPU_VM_API_TOKEN:-}
      DOMAIN_URL: *url-domain
      FRONTEND_URL_AUTH: *url-frontend-auth
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ADMIN_MAIL: ${ADMIN_MAIL:-}
    volumes:
      - uploads-data:/tmp/uploads
      - /var/lib/understandtech/app-data:/app/storage
    networks:
      - ut-backend-network
      - ut-frontend-network
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: ${WORKER_CUSTOMER_REPLICAS:-}
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G

  app-llms:
    image: ${LLMS_APP_IMAGE:-}
    container_name: ut-app-llms
    restart: unless-stopped
    expose:
      - "80"
    environment:
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_PORT: ${MONGODB_PORT:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DB: ${APP_LLMS_MONGODB_DB:-ut-app-llms}
      VITE_DB_PROVIDER: ${DB_PROVIDER:-}
      VITE_API_BASE_URL: *url-vite-api-base
      VITE_UT_APP_URL: *url-vite-ut-app
      UT_APP_BASE_URL: http://api:8501/api
      UT_CUSTOMER_URL: http://api-customer:8501
      UNDERSTAND_API_VERSION: ${UNDERSTAND_API_VERSION:-v3}
      UT_JWT_SECRET: ${JWT_SECRET:-}
      UT_APP_LLMS_BASE_URL: *url-app-llms
      CORS_ORIGINS: *url-app-llms-cors
    networks:
      - ut-frontend-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      <<: *healthcheck-defaults
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  app-assistants:
    image: ${ASSISTANTS_APP_IMAGE:-}
    container_name: ut-app-assistants
    restart: unless-stopped
    expose:
      - "80"
    environment:
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_PORT: ${MONGODB_PORT:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGO_DB: ${APP_ASSISTANTS_MONGODB_DB:-ut-app-assistants}
      VITE_DB_PROVIDER: ${DB_PROVIDER:-}
      VITE_API_BASE_URL: *url-vite-api-base
      VITE_UT_APP_URL: *url-vite-ut-app
      UT_APP_BASE_URL: http://api:8501/api
      UT_CUSTOMER_URL: http://api-customer:8501
      UNDERSTAND_API_VERSION: ${UNDERSTAND_API_VERSION:-v3}
      UT_JWT_SECRET: ${JWT_SECRET:-}
      UT_APP_ASSISTANTS_BASE_URL: *url-app-assistants
      CORS_ORIGINS: *url-app-assistants-cors
    volumes:
      - /var/lib/understandtech/app-data:/app/storage
    networks:
      - ut-frontend-network
      - ut-backend-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      <<: *healthcheck-defaults
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  admin-portal:
    image: ${ADMIN_PORTAL_IMAGE:-}
    container_name: ut-admin-portal
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      VITE_API_URL: http://api:8501
    networks:
      - ut-frontend-network
      - ut-backend-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      <<: *healthcheck-defaults
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

  nim-llm:
    profiles:  ["nim", "nim-llm"]
    image: ${NIM_IMAGE:-}
    container_name: nim-llm
    restart: unless-stopped
    shm_size: "16gb"
    environment:
      #- NGC_API_KEY=${NGC_API_KEY:-${NVIDIA_API_KEY:-}}
      - HF_TOKEN=${HF_TOKEN:-${HF_API_TOKEN:-}}
      - NIM_MODEL_PATH=${NIM_LLM_MODEL_PATH:-}
      - NIM_SERVED_MODEL_NAME=${LLM_MODEL:-openai/gpt-oss-20b}
      - NIM_PASSTHROUGH_ARGS=${NIM_LLM_PASSTHROUGH_ARGS:---gpu-memory-utilization 0.55 --max-model-len 32768 --enable-auto-tool-choice --tool-call-parser qwen3_coder --reasoning-parser nemotron_v3}
    ports:
      - "8001:8000"
    volumes:
      - nim-llm-cache:/opt/nim/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45m
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ut-backend-network
      - ut-frontend-network

  nim-vlm:
    profiles: ["nim", "nim-vlm"]
    image: ${NIM_IMAGE:-}
    container_name: nim-vlm
    restart: unless-stopped
    shm_size: "16gb"
    environment:
      #- NGC_API_KEY=${NGC_API_KEY:-${NVIDIA_API_KEY:-}}
      - HF_TOKEN=${HF_TOKEN:-${HF_API_TOKEN:-}}
      - NIM_MODEL_PATH=${NIM_VLM_MODEL_PATH:-hf://Qwen/Qwen3-VL-4B-Instruct}
      - NIM_SERVED_MODEL_NAME=${VLM_MODEL:-Qwen/Qwen3-VL-4B-Instruct}
      - NIM_PASSTHROUGH_ARGS=${NIM_VLM_PASSTHROUGH_ARGS:---gpu-memory-utilization 0.25 --max-model-len 8192}
    ports:
      - "8002:8000"
    volumes:
      - nim-vlm-cache:/opt/nim/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45m
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ut-backend-network
      - ut-frontend-network

  llm:
    image: ${LLM_IMAGE:-}
    container_name: ut-llm
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOCAL_STORAGE_BASE: ${LOCAL_STORAGE_BASE:-}
      DB_PROVIDER: ${DB_PROVIDER:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
      GPU_VM_API_TOKEN: ${GPU_VM_API_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      OLLAMA_MODEL_LLM: ${OLLAMA_MODEL_LLM:-}
      OLLAMA_MODEL_CONDENSE_LLM: ${OLLAMA_MODEL_CONDENSE_LLM:-}
      OLLAMA_MODEL_VLM: ${OLLAMA_MODEL_VLM:-}
      OLLAMA_HOST_PORT: ${OLLAMA_HOST_PORT:-}
      MODELS_DIR: ${MODELS_DIR:-}
      EMBED_URL: ${EMBED_URL:-}
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-}
      MONGODB_HOST: ${MONGODB_HOST:-}
      MONGODB_PORT: ${MONGODB_PORT:-}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-}
      RERANKER_HF_PATH: ${RERANKER_HF_PATH:-}
      RERANKER_MODEL_NAME: ${RERANKER_MODEL_NAME:-}
      VLLM_LLM_MODEL: ${VLLM_LLM_MODEL:-}
      VLLM_CONDENSE_MODEL: ${VLLM_CONDENSE_MODEL:-}
      VLLM_VLM_MODEL: ${VLLM_VLM_MODEL:-}
      VLLM_LLM_BASE_URL: ${VLLM_LLM_BASE_URL:-}
      VLLM_VLM_BASE_URL: ${VLLM_VLM_BASE_URL:-}
      VLLM_LLM_GPU_MEM_UTIL: ${VLLM_LLM_GPU_MEM_UTIL:-}
      VLLM_VLM_GPU_MEM_UTIL: ${VLLM_VLM_GPU_MEM_UTIL:-}
      VLLM_LLM_EXTRA_ARGS: ${VLLM_LLM_EXTRA_ARGS:-}
      VLLM_VLM_EXTRA_ARGS: ${VLLM_VLM_EXTRA_ARGS:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      LLM_BACKEND: ${LLM_BACKEND:-}
      DOWNLOAD_ONNX_EMBED: ${DOWNLOAD_ONNX_EMBED:-}
      ONNX_EMBED_HF_REPO: ${ONNX_EMBED_HF_REPO:-}
      EMBED_MODEL_BACKEND: ${EMBED_MODEL_BACKEND:-}
      LLM_MAX_CONTEXT_LEN: ${LLM_MAX_CONTEXT_LEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-}
    volumes:
      - vllm-models:/root/.cache/huggingface
      - llm-ollama:/root/.ollama
      - llm-models:/root/models
      - /var/lib/understandtech/app-data:/app/storage
    networks:
      - ut-backend-network
      - ut-frontend-network # Add the frontend network during first-time installation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      <<: *healthcheck-defaults
      start_period: 120s
    logging: *default-logging
    stop_grace_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  ut-backend-network:
    name: ut-backend-network
    driver: bridge
    internal: true
  ut-frontend-network:
    name: ut-frontend-network
    driver: bridge

volumes:
  caddy-data:
    name: ut-caddy-data
  caddy-config:
    name: ut-caddy-config
  redis-data:
    name: ut-redis-data
  uploads-data:
    name: ut-uploads-data
  mongodb-data:
    name: ut-mongodb-data
  mongodb-backups:
    name: ut-mongodb-backup
  llm-ollama:
    name: ut-llm-ollama
  llm-models:
    name: ut-llm-models
  vllm-models:
    name: ut-vllm-models
  nim-llm-cache:
    name: ut-nim-llm-cache
  nim-vlm-cache:
    name: ut-nim-vlm-cache
  vllm-llm-cache:
    name: ut-vllm-llm-cache